name: Speak
description: >-
  Speak (Speakeasy Labs, Inc.) is an AI-powered language learning application
  focused on spoken fluency rather than grammar drills or vocabulary
  memorization. Its proprietary "Speak Method" has learners study real phrases,
  practice them across contexts, and then apply them in back-and-forth
  conversation with an AI tutor that gives real-time pronunciation and fluency
  feedback. Speak teaches Spanish, French, Korean, Japanese, Italian, German,
  and Chinese, plus English for non-English speakers, and offers B2B language
  training for organizations across Korea, Japan, Spain, Taiwan, and France.
  The company is backed by Accel and the OpenAI Startup Fund and partners with
  OpenAI. Speak runs a production application backend at api.usespeak.com
  (an OAuth2/OIDC issuer) but does not publish a public developer API,
  OpenAPI specification, or SDKs; the surfaces below were discovered from the
  company's public well-known and llms.txt endpoints.
